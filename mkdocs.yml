site_name: "FluDa SQL Init"
site_description: "Automated database schema initialization and migration for Jakarta EE and CDI."
site_url: https://fludakit.github.io/sql-init/
repo_url: https://github.com/fludakit/sql-init
repo_name: fludakit/sql-init

theme:
  name: material
  logo: https://fludakit.github.io/assets/fluda-badge-light.svg
  favicon: https://fludakit.github.io/assets/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: lime
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.footer
    - search.suggest
  icon:
    repo: fontawesome/brands/git-alt

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fludakit

markdown_extensions:
  - meta
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Version Strategy: version-strategy.md
  - Resource Resolver: resource-resolver.md
